<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EV Fleet Tracker</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Leaflet CSS (Map) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        body { background-color: #f8f9fa; }
        #map { height: 400px; width: 100%; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .status-card { background: white; border-radius: 10px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .indicator { width: 15px; height: 15px; border-radius: 50%; display: inline-block; margin-right: 5px; }
        .on { background-color: #28a745; box-shadow: 0 0 10px #28a745; }
        .off { background-color: #dc3545; }
        .waiting { animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0.5; } }
    </style>
</head>
<body>

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <span class="navbar-brand mb-0 h1">🚀 EV Fleet Telematics</span>
        <span class="text-white" id="last-seen">Offline</span>
    </div>
</nav>

<div class="container mt-4">
    <div class="row">
        <!-- MAP COLUMN -->
        <div class="col-md-8">
            <div id="map"></div>
        </div>

        <!-- CONTROLS COLUMN -->
        <div class="col-md-4">
            <div class="status-card text-center">
                <h4>Device Control</h4>
                <hr>
                <div class="mb-3">
                    <span id="relay-indicator" class="indicator off"></span>
                    <strong id="relay-text">RELAY IS OFF</strong>
                </div>
                
                <div class="d-grid gap-2">
                    <button class="btn btn-success btn-lg" onclick="sendCommand('ON')">TURN ON</button>
                    <button class="btn btn-danger btn-lg" onclick="sendCommand('OFF')">TURN OFF</button>
                </div>
                <p class="text-muted mt-2 small">Command is queued until next device ping.</p>
            </div>

            <div class="status-card">
                <h5>Telemetry</h5>
                <ul class="list-group list-group-flush">
                    <li class="list-group-item">Speed: <strong id="speed">0</strong> km/h</li>
                    <li class="list-group-item">Lat: <span id="lat">0.0</span></li>
                    <li class="list-group-item">Lng: <span id="lng">0.0</span></li>
                </ul>
            </div>
        </div>
    </div>
</div>

<!-- Scripts -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    // 1. Initialize Map
    var map = L.map('map').setView([20.5937, 78.9629], 5); // Default India view
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    var marker = L.marker([20.5937, 78.9629]).addTo(map);

    // 2. Poll Data Function
    function updateDashboard() {
        fetch('/api/status')
            .then(response => response.json())
            .then(data => {
                // Update Text
                document.getElementById('last-seen').innerText = "Last Seen: " + data.last_seen;
                document.getElementById('speed').innerText = data.speed.toFixed(1);
                document.getElementById('lat').innerText = data.lat.toFixed(6);
                document.getElementById('lng').innerText = data.lng.toFixed(6);

                // Update Map
                if (data.lat !== 0 && data.lng !== 0) {
                    var newLatLng = new L.LatLng(data.lat, data.lng);
                    marker.setLatLng(newLatLng);
                    map.panTo(newLatLng); 
                }

                // Update Relay Status UI
                var indicator = document.getElementById('relay-indicator');
                var text = document.getElementById('relay-text');
                
                // If target state matches actual state, we are synced
                if (data.relay_state === data.target_relay_state) {
                    if (data.relay_state) {
                        indicator.className = "indicator on";
                        text.innerText = "RELAY IS ON";
                    } else {
                        indicator.className = "indicator off";
                        text.innerText = "RELAY IS OFF";
                    }
                } else {
                    // Waiting for update
                    indicator.className = "indicator waiting " + (data.target_relay_state ? "on" : "off");
                    text.innerText = "SENDING COMMAND...";
                }
            });
    }

    // 3. Send Command Function
    function sendCommand(action) {
        fetch('/api/control', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action: action })
        }).then(() => {
            // Force an immediate UI refresh to show "Sending..." state
            updateDashboard();
        });
    }

    // Auto-Update every 2 seconds
    setInterval(updateDashboard, 2000);
    updateDashboard(); // Initial call
</script>

</body>
</html>
